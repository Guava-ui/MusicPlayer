<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Music Player</title>
  <link rel="stylesheet" href="play.css" />
</head>
<body>
  <div class="player-wrap" role="application" aria-label="Music player mock">
    <div class="art">
      <img id="cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1200'><rect width='100%' height='100%' fill='%230a0a0a'/><text x='50%' y='50%' fill='%23777777' font-size='48' font-family='Arial' text-anchor='middle' dominant-baseline='middle'>Album Art</text></svg>" alt="album art">
    </div>

    <div class="meta">
      <div class="source">MyPhone</div>
      <h1 class="title" id="title">Judul Lagu</h1>
      <div class="artist" id="artist">Artist</div>

      <div class="progress-row">
        <div class="time" id="current">0:00</div>
        <div class="progress" id="progress">
          <div class="bar" id="bar"></div>
          <div class="thumb" id="thumb"></div>
        </div>
        <div class="time right" id="duration">-0:00</div>
      </div>

      <div class="controls">
        <div class="btn" id="prev" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6v12l10.5-6zM18 6v12h2V6z"/></svg>
        </div>
        <div class="btn play" id="play" title="Play/Pause">
          <svg id="playicon" viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>
        </div>
        <div class="btn" id="next" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 6v12l10.5-6zM18 6v12h2V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
        </div>
      </div>

      <div class="bottom">
        <div class="volume">
          <div class="small">🔈</div>
          <div class="vol-slider" id="volslider"><div class="vol-bar" id="volbar"></div></div>
          <div class="small" id="speed">1x</div>
        </div>
      </div>

      <div class="file-row">
        <label class="file-label" for="file">Pilih file audio</label>
        <input id="file" type="file" accept="audio/*">
        <div style="flex:1"></div>
        <div class="small">Tekan cover untuk ganti gambar</div>
      </div>

    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
 
  <script src="main.js">
  </script>
</body>
</html>
